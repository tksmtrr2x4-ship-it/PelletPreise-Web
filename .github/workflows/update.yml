name: Preise abrufen
on:
  schedule:
    - cron: '7 * * * *'   # stündlich; committet nur bei geänderten Preisen
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: node scripts/update.mjs
      - name: Änderungen committen
        run: |
          git config user.name "pelletpreise-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/prices.json
          git diff --cached --quiet || (git commit -m "Preise $(date -u +%F)" && git push)
